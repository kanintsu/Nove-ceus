name: Validate Godot Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static project checks
        run: python3 tools/validate_project.py

  godot:
    needs: static
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then exit 1; fi
      - name: Boot main scene briefly
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 3 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Failed to load script" boot.log; then exit 1; fi
