name: Build Universe Simulator APK

on:
  push:
    branches: [ universe-simulator-v1 ]
    paths:
      - "android-universe/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android-universe
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p ../builds
          cp app/build/outputs/apk/debug/app-debug.apk ../builds/NoveCeus-Universe-v1.apk
          test -s ../builds/NoveCeus-Universe-v1.apk
          ls -lh ../builds/NoveCeus-Universe-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoveCeus-Universe-v1-Android
          path: builds/NoveCeus-Universe-v1.apk
          if-no-files-found: error
          retention-days: 14
