name: Build Android Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a /root/.config/godot ~/.config/godot
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Android debug APK
        run: |
          mkdir -p builds
          godot --headless --verbose --path . --export-debug "Android" builds/NoveCeus-v0.7.apk
          test -s builds/NoveCeus-v0.7.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoveCeus-v0.7-Android
          path: builds/NoveCeus-v0.7.apk
          if-no-files-found: error
