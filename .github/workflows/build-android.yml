name: Build Universe Simulator APK

on:
  push:
    branches: [ universe-simulator-v1 ]
    paths:
      - "android-universe/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android-universe
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p ../builds
          cp app/build/outputs/apk/debug/app-debug.apk ../builds/NoveCeus-Universe-v1.apk
          test -s ../builds/NoveCeus-Universe-v1.apk
          ls -lh ../builds/NoveCeus-Universe-v1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoveCeus-Universe-v1-Android
          path: builds/NoveCeus-Universe-v1.apk
          if-no-files-found: error
          retention-days: 14
